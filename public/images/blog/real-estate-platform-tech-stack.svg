<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Seven layers of a real estate platform stack</title><desc id="d">Seven stack layers with their options, numbered as in the guide: system of record, search, cache, backend, frontend rendering, media and hosting.</desc>
