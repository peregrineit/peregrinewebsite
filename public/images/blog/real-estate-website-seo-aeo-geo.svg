<path d="M822 342 l6 6 l11 -12" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="852" y="348" fill="#f1f5f9" font-size="16.5">Decide on training crawlers</text>
<path d="M822 394 l6 6 l11 -12" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="852" y="400" fill="#f1f5f9" font-size="16.5">No published ranking formula</text>
<path d="M822 446 l6 6 l11 -12" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="852" y="452" fill="#f1f5f9" font-size="16.5">llms.txt: a proposal, not a lever</text>
<path d="M822 498 l6 6 l11 -12" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="852" y="504" fill="#f1f5f9" font-size="16.5">Same foundations as SEO</text>
<text x="48" y="602" fill="#94a3b8" font-size="14">From the SEO, AEO and GEO guide, based on primary documentation read October 12, 2026.</text>
