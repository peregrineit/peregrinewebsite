<rect x="946.0" y="278" width="206" height="40" rx="8" fill="#162036" stroke="#2a3a59"/><text x="1049.0" y="303.0" fill="#f1f5f9" font-size="16" text-anchor="middle">MLS PIN</text>
<rect x="946.0" y="330" width="206" height="40" rx="8" fill="#162036" stroke="#2a3a59"/><text x="1049.0" y="355.0" fill="#f1f5f9" font-size="16" text-anchor="middle">Realcomp</text>
