<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Which data platform delivers which MLS</title><desc id="d">Five data platforms and the MLSs delivered through each. MLS Grid: Stellar MLS, MRED, OneKey MLS, NWMLS, NorthstarMLS. Trestle: CRMLS, NTREIS, MIAMI MLS. Bridge Interactive: Stellar MLS, MIAMI MLS, FMLS, REcolorado. Spark: ARMLS. Its own API: Bright MLS, MLS PIN, Realcomp, Metro MLS.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="48" y="44" width="56" height="6" rx="3" fill="url(#ac)"/>
<text x="48" y="92" fill="#f1f5f9" font-size="34" font-weight="700">Which data platform delivers which MLS</text>
<text x="48" y="124" fill="#94a3b8" font-size="18">15 US MLSs, as each one&#x27;s own site describes its data delivery. Two use more than one platform.</text>
