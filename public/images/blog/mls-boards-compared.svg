<text x="48" y="602" fill="#94a3b8" font-size="14">As stated on each MLS&#x27;s site, October 12, 2026. Stellar MLS and MIAMI MLS appear twice.</text>
<text x="1152" y="602" fill="#94a3b8" font-size="14" text-anchor="end">peregrine-it.com</text>
