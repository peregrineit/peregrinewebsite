<line x1="375.5" y1="206" x2="375.5" y2="226" stroke="#2a3a59" stroke-width="2"/>
<rect x="272.5" y="226" width="206" height="40" rx="8" fill="#162036" stroke="#2a3a59"/><text x="375.5" y="251.0" fill="#f1f5f9" font-size="16" text-anchor="middle">CRMLS</text>
